info:
  name: Blocked hours (200)
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}/availability?start=2031-08-01&end=2031-08-01"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("appointments and time off are merged, ISO with T", function () {
          expect(res.body["2031-08-01"]).to.deep.equal(["2031-08-01T10:00:00","2031-08-01T11:00:00","2031-08-01T13:00:00","2031-08-01T14:00:00"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
