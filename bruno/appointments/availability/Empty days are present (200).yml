info:
  name: Empty days are present (200)
  type: http
  seq: 2

http:
  method: GET
  url: "{{api_url}}/availability?start=2031-08-02&end=2031-08-04"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("every date is a key, end inclusive", function () {
          expect(res.body).to.deep.equal({"2031-08-02": [], "2031-08-03": [], "2031-08-04": []});
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
