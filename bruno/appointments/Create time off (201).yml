info:
  name: Create time off (201)
  type: http
  seq: 6

http:
  method: POST
  url: "{{api_url}}/time-off"
  body:
    type: json
    data: |-
      {
        "start_at": "2031-08-01T13:00:00",
        "end_at": "2031-08-01T15:00:00"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("appt_time_off_id", res.body.id);
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
