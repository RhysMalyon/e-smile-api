info:
  name: List (200)
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}/appointments"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("includes both bookings", function () {
          const ids = res.body.map((a) => a.id);
          expect(ids).to.include(bru.getVar("appointment_id"));
          expect(ids).to.include(bru.getVar("appointment2_id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
