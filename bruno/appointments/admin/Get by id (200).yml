info:
  name: Get by id (200)
  type: http
  seq: 3

http:
  method: GET
  url: "{{api_url}}/appointments/{{appointment_id}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("booking_customer_id", res.body.customer_id);
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("full row, no note on the first booking", function () {
          expect(res.body.admin_notes).to.equal(null);
          expect(res.body.customer_id).to.be.a("number");
          expect(res.body.price_at_booking).to.equal(5000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
