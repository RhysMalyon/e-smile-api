info:
  name: Tel mismatch note (200)
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_url}}/appointments/{{appointment2_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("note mentions both numbers, same customer", function () {
          expect(res.body.admin_notes).to.contain("090-1234-5678");
          expect(res.body.admin_notes).to.contain("080-9999-0000");
          expect(res.body.customer_id).to.equal(bru.getVar("booking_customer_id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
