info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{login_email}}",
        "password": "{{login_password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("access_token", res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
