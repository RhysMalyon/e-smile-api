info:
  name: Create duplicate name (409)
  type: http
  seq: 3

http:
  method: POST
  url: "{{api_url}}/courses"
  body:
    type: json
    data: |-
      {
        "name": "{{course_name}}",
        "length": 30,
        "price": 5000,
        "is_active": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 409", function () {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
