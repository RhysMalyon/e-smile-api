info:
  name: Courses (Admin) (200)
  type: http
  seq: 9

http:
  method: GET
  url: "{{api_url}}/courses/admin"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("includes the created course with full row", function () {
          const c = res.body.find((x) => x.id === bru.getVar("course_id"));
          expect(c).to.not.equal(undefined);
          expect(c).to.have.property("is_active");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
