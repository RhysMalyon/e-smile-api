info:
  name: Full year (200)
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_url}}/closed-dates?start=2027-01-01&end=2027-12-31"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("a year of closures", function () {
          expect(res.body.length).to.be.above(100);
          expect(res.body).to.include('2027-01-01');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
