info:
  name: Create (201)
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}/time-off"
  body:
    type: json
    data: |-
      {
        "start_at": "2030-08-01T10:00:00",
        "end_at": "2030-08-01T12:00:00"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("time_off_id", res.body.id);
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.status).to.equal(201);
        });

        test("range is echoed back", function () {
          expect(res.body.start_at).to.equal("2030-08-01T10:00:00");
          expect(res.body.end_at).to.equal("2030-08-01T12:00:00");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
