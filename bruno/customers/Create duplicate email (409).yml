info:
  name: Create duplicate email (409)
  type: http
  seq: 3

http:
  method: POST
  url: "{{api_url}}/customers"
  body:
    type: json
    data: |-
      {
        "email": "{{customer_email}}",
        "first_name": "太郎",
        "last_name": "山田",
        "first_name_phonetic": "タロウ",
        "last_name_phonetic": "ヤマダ",
        "tel": "090-1234-5678"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 409", function () {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
