info:
  name: Create second customer (201)
  type: http
  seq: 4

http:
  method: POST
  url: "{{api_url}}/customers"
  body:
    type: json
    data: |-
      {
        "email": "hanako.{{$timestamp}}@example.com",
        "first_name": "花子",
        "last_name": "山田",
        "first_name_phonetic": "タロウ",
        "last_name_phonetic": "ヤマダ",
        "tel": "090-1234-5678"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("other_customer_email", res.body.email);
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
